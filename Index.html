<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a Version</title>
<style>
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: #f5f1e8;
    font-family: sans-serif;
    color: #1a1a1a;
    text-align: center;
  }
  h1 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin-bottom: 2rem;
  }
  .options {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 3rem;
  }
  .card {
    display: block;
    width: 300px;
    text-decoration: none;
    color: inherit;
    border: 1px solid #ddd;
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
  .card:hover {
    border-color: #999;
  }
  .card iframe {
    width: 100%;
    height: 200px;
    border: none;
    pointer-events: none;
    display: block;
  }
  .card .label {
    padding: 0.7rem;
    font-size: 0.85rem;
    border-top: 1px solid #ddd;
  }
  p {
    font-size: 0.85rem;
    color: #666;
  }
  a.email {
    color: #1a1a1a;
  }
</style>
</head>
<body>

  <h1>Choose a Version</h1>
  <div class="options">
    <a class="card" href="index1.html">
      <iframe src="index1.html" title="Preview of Version 1"></iframe>
      <div class="label">Version 1 &rarr;</div>
    </a>
    <a class="card" href="index2.html">
      <iframe src="index2.html" title="Preview of Version 2"></iframe>
      <div class="label">Version 2 &rarr;</div>
    </a>
  </div>

  <p>
    Built by FishTankTech &middot;
    <a class="email" href="mailto:hello@fishtanktech.xyz">Email us</a>
  </p>

</body>
</html>
