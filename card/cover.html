<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FishTankTech — LinkedIn Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07090a;
    --bg-1:#0d1210;
    --line:#1c2622;
    --ink:#e9efe9;
    --ink-dim:#7d8f87;
    --accent:#007e8f;
    --accent-dim:#4a959f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:1584px;
    height:396px;
    background:var(--bg-0);
    overflow:hidden;
    font-family:'IBM Plex Mono', monospace;
  }

  .cover{
    position:relative;
    width:1584px;
    height:396px;
    background:
      radial-gradient(ellipse 900px 500px at 82% 20%, rgba(57,255,136,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    display:flex;
    align-items:center;
  }

  /* faint grid */
  .grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:44px 44px;
    opacity:0.35;
    mask-image: linear-gradient(90deg, transparent 0%, black 22%, black 100%);
  }

  /* scanline sheen */
  .scan{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  /* glyph field, left zone (safe under profile photo on mobile+desktop) */
  .glyphs{
    position:absolute;
    left:36px;
    top:0;
    width:400px;
    height:396px;
  }
  .glyphs span{
    position:absolute;
    color:var(--accent-dim);
    font-size:22px;
    opacity:0.55;
  }

  .content{
    position:relative;
    z-index:2;
    padding-left:430px;
    padding-right:70px;
    width:100%;
  }

  .prompt{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink-dim);
    font-size:19px;
    letter-spacing:0.02em;
    margin-bottom:18px;
  }
  .prompt .sigil{ color:var(--accent); }
  .caret{
    display:inline-block;
    width:11px;
    height:20px;
    background:var(--accent);
    margin-left:4px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:76px;
    letter-spacing:-0.01em;
    color:var(--ink);
    line-height:1;
    display:flex;
    align-items:baseline;
    gap:2px;
  }
  .wordmark .accent-bracket{
    color:var(--accent);
    font-weight:600;
    font-size:0.75em;
  }

  .tagline{
    margin-top:16px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:23px;
    color:var(--ink-dim);
    letter-spacing:0.01em;
  }
  .tagline b{
    color:var(--accent);
    font-weight:600;
  }

  .rule{
    margin-top:26px;
    width:560px;
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  .meta{
    margin-top:22px;
    display:flex;
    gap:34px;
  }
  .meta-item{
    font-size:14px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .meta-item b{
    display:block;
    color:var(--ink);
    font-size:15px;
    text-transform:none;
    letter-spacing:0;
    margin-top:4px;
    font-weight:500;
  }

  .corner-tag{
    position:absolute;
    top:32px;
    right:56px;
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:2px;
  }
  .corner-tag span{ color:var(--accent); }
</style>
</head>
<body>

  <div class="cover">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="glyphs">
      <span style="left:60px; top:58px; font-size:34px;">⬡</span>
      <span style="left:190px; top:130px; font-size:20px;">⟁</span>
      <span style="left:110px; top:230px; font-size:26px;">◈</span>
      <span style="left:250px; top:300px; font-size:18px;">⬡</span>
      <span style="left:40px; top:320px; font-size:16px;">⟁</span>
      <span style="left:300px; top:70px; font-size:15px;">◈</span>
    </div>

    <div class="corner-tag">status: <span>available for work</span></div>

    <div class="content">
      <div class="prompt"><span class="sigil">$</span> whoami<span class="caret"></span></div>

      <div class="wordmark"><span class="accent-bracket">[</span>FishTankTech<span class="accent-bracket">]</span></div>

      <div class="tagline">Development <b>Without Drowning</b></div>

      <div class="rule"></div>

      <div class="meta">
        <div class="meta-item">discipline<b>Software Engineering</b></div>
        <div class="meta-item">focus<b>Systems &amp; Web</b></div>
        <div class="meta-item">base<b>Asheville, NC</b></div>
      </div>
    </div>
  </div>

</body>
</html>
